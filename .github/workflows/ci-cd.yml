name: StudyPilot Backend CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

jobs:
  lint-test-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studypilot_test
          POSTGRES_PASSWORD: studypilot_test_password
          POSTGRES_DB: studypilot_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        run: npx prisma validate && npx prisma generate

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgresql://studypilot_test:studypilot_test_password@localhost:5432/studypilot_test_db?schema=public
          DIRECT_DATABASE_URL: postgresql://studypilot_test:studypilot_test_password@localhost:5432/studypilot_test_db?schema=public
        run: npx prisma migrate deploy

      - name: Run Automated Backend Verification Suite
        env:
          NODE_ENV: test
        run: npm test

      - name: Build Production Bundle
        run: npm run build
