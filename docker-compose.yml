version: '3.9'

services:
  studypilot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studypilot-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://studypilot:studypilot_dev_pass@postgres:5432/studypilot_db?schema=public
      DIRECT_DATABASE_URL: postgresql://studypilot:studypilot_dev_pass@postgres:5432/studypilot_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: studypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studypilot
      POSTGRES_PASSWORD: studypilot_dev_pass
      POSTGRES_DB: studypilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studypilot -d studypilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studypilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: studypilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studypilot_minio
      MINIO_ROOT_PASSWORD: studypilot_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
